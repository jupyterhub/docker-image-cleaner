[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-image-cleaner"
license = "BSD-3-Clause"
# match semver pattern here for docker,
# ('1.0.0-beta.3', not PEP440 `1.0.0b3`)
# build tools will normalize
version = "1.0.0-beta.3"
dynamic = ["readme", "dependencies"]
description = "Cleanup old docker images to free up disk space and inodes"
authors = [
    { name = "Project Jupyter Contributors", email = "jupyter@googlegroups.com" },
]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/jupyterhub/docker-image-cleaner"

[project.scripts]
docker-image-cleaner = "docker_image_cleaner.__main__:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

# dynamic sources of metadata in other files
[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = { file = "requirements.in" }

# autoflake is used for autoformatting Python code
#
# ref: https://github.com/PyCQA/autoflake#readme
#
[tool.autoflake]
ignore-init-module-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true
#remove-unused-variables = true


# isort is used for autoformatting Python code
#
# ref: https://pycqa.github.io/isort/
#
[tool.isort]
profile = "black"


# black is used for autoformatting Python code
#
# ref: https://black.readthedocs.io/en/stable/
#
[tool.black]


# pytest is used for running Python based tests
#
# ref: https://docs.pytest.org/en/stable/
#
[tool.pytest.ini_options]
addopts = "--verbose --color=yes --maxfail=2 --durations=10"
log_level = "INFO"
testpaths = ["tests"]
